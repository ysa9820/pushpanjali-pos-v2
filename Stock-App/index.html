<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pushpanjali Stock Room</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      input[type="number"]::-webkit-inner-spin-button, 
      input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
      input[type="number"] { -moz-appearance: textfield; }

      /* STRICT THERMAL PRINTER CSS */
      @media print {
        @page { size: 50mm 25mm; margin: 0; padding: 0; }
        body, html { width: 50mm; height: 25mm; background: white !important; margin: 0; padding: 0; }
        body > :not(#printable-barcode) { display: none !important; }
        
        #printable-barcode { display: block !important; width: 100%; margin: 0; padding: 0; }
        
        .barcode-page { 
          width: 50mm; height: 25mm; 
          page-break-after: always; 
          page-break-inside: avoid;
          display: flex !important; flex-direction: column !important; 
          align-items: center !important; justify-content: center !important; 
          overflow: hidden; box-sizing: border-box;
        }
        
        * { -webkit-print-color-adjust: exact !important; color-adjust: exact !important; color: black !important; }
      }
    </style>
  </head>
  <body class="bg-gray-200">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
